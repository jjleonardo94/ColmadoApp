databases:
  - name: colmadopos-db
    databaseName: colmadopos_db
    user: colmadopos_user
    plan: free

services:
  - type: web
    name: colmadopos
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: colmadopos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9
